- id: Q15
  defect_ids:
  - D6
  question: 哪些 email 注册了多个账号？（按 email 升序）
  answer_type: table
  gold_sql: SELECT email FROM customers GROUP BY email HAVING COUNT(*) > 1 ORDER BY email
  naive_sql: SELECT email FROM customers GROUP BY customer_id, email HAVING COUNT(*) > 1 ORDER BY email
- id: Q16
  defect_ids:
  - D7
  question: 2024-12-04（本地日期）当天有多少个订单？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM orders WHERE DATE(DATE_SUB(placed_at, INTERVAL IF(source='WEB',5,0) HOUR)) = '2024-12-04'
  naive_sql: SELECT COUNT(*) FROM orders WHERE DATE(placed_at) = '2024-12-04'
- id: Q17
  defect_ids:
  - D7
  question: 2025-02-22（本地日期）当天，本地时间 19 点及以后下了多少个订单？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM orders WHERE DATE(DATE_SUB(placed_at, INTERVAL IF(source='WEB',5,0) HOUR)) = '2025-02-22' AND HOUR(DATE_SUB(placed_at, INTERVAL IF(source='WEB',5,0) HOUR)) >= 19
  naive_sql: SELECT COUNT(*) FROM orders WHERE DATE(placed_at) = '2025-02-22' AND HOUR(placed_at) >= 19
