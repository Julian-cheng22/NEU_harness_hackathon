# 31 questions: Q01-Q25 defect-focused, C01-C06 controls. Gold answers verified against MySQL for dataset v1.0.0.
questions:
- id: Q01
  defect_ids:
  - D1
  question: 有多少位客户写过评价？
  answer_type: scalar
  gold_sql: SELECT COUNT(DISTINCT c.customer_id) FROM customers c JOIN reviews r ON r.user_id = c.customer_id
  naive_sql: SELECT COUNT(DISTINCT c.customer_id) FROM customers c JOIN reviews r ON r.customer_id = c.customer_id
  notes: reviews 的客户列叫 user_id
- id: Q02
  defect_ids:
  - D1
  question: 退货件数最多的前 3 位客户是谁？（只统计现有客户；同数按客户 ID 升序）
  answer_type: table
  gold_sql: SELECT c.customer_id FROM customers c JOIN returns r ON r.buyer_id = c.customer_id GROUP BY c.customer_id ORDER BY COUNT(*) DESC, c.customer_id LIMIT 3
  naive_sql: SELECT c.customer_id FROM customers c JOIN returns r ON r.customer_id = c.customer_id GROUP BY c.customer_id ORDER BY COUNT(*) DESC, c.customer_id LIMIT 3
- id: Q03
  defect_ids:
  - D1
  question: 有多少个订单已经有发货记录？
  answer_type: scalar
  gold_sql: SELECT COUNT(DISTINCT o.order_id) FROM orders o JOIN shipments s ON s.order_ref = o.order_id
  naive_sql: SELECT COUNT(DISTINCT o.order_id) FROM orders o JOIN shipments s ON s.order_id = o.order_id
- id: Q04
  defect_ids:
  - D2
  question: 已送达（DELIVERED）的订单有多少个？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM orders WHERE status = 'DELIVERED'
  naive_sql: SELECT COUNT(*) FROM orders WHERE status = 'captured'
  notes: 模型把 payments 的取值套到 orders 上
- id: Q05
  defect_ids:
  - D2
  question: 已扣款（captured）的支付有多少笔？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM payments WHERE status = 'captured'
  naive_sql: SELECT COUNT(*) FROM payments WHERE status = 'DELIVERED'
- id: Q06
  defect_ids:
  - D3
  question: 下单数最多的前 10 位客户是谁？（只统计现有客户；同数按客户 ID 升序）
  answer_type: table
  gold_sql: SELECT c.customer_id FROM customers c JOIN orders o ON o.customer_id = c.customer_id GROUP BY c.customer_id ORDER BY COUNT(*) DESC, c.customer_id LIMIT 10
  naive_sql: SELECT customer_id FROM customers ORDER BY order_count DESC, customer_id LIMIT 10
  notes: customers.order_count 是过期缓存
- id: Q07
  defect_ids:
  - D3
  - D5
  question: 至少有 3 条有效评分的商品里，平均评分最高的前 3 个是哪些？（同分按商品 ID 升序）
  answer_type: table
  gold_sql: SELECT product_id FROM reviews WHERE rating REGEXP '^-?[0-9]+(\\.[0-9]+)?$' GROUP BY product_id HAVING COUNT(*) >= 3 ORDER BY AVG(CAST(rating AS DECIMAL(4,2))) DESC, product_id LIMIT 3
  naive_sql: SELECT product_id FROM products ORDER BY avg_rating DESC, product_id LIMIT 3
  notes: products.avg_rating 是过期缓存
- id: Q08
  defect_ids:
  - D4
  question: 目前仍在运输中（未送达且未丢失）的包裹有多少个？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM shipments WHERE status = 'IN_TRANSIT'
  naive_sql: SELECT COUNT(*) FROM shipments WHERE delivered_at IS NULL
  notes: 丢失包裹的 delivered_at 也为空
- id: Q09
  defect_ids:
  - D4
  question: 有多少个包裹的物流已经结束（已送达或已丢失）？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM shipments WHERE status <> 'IN_TRANSIT'
  naive_sql: SELECT COUNT(*) FROM shipments WHERE delivered_at IS NOT NULL
- id: Q10
  defect_ids:
  - D5
  question: 所有评价的平均评分是多少？
  answer_type: scalar
  gold_sql: SELECT AVG(CAST(rating AS DECIMAL(4,2))) FROM reviews WHERE rating REGEXP '^-?[0-9]+(\\.[0-9]+)?$'
  naive_sql: SELECT AVG(rating) FROM reviews
- id: Q11
  defect_ids:
  - D5
  question: Electronics 类商品评价的平均评分是多少？
  answer_type: scalar
  gold_sql: SELECT AVG(CAST(r.rating AS DECIMAL(4,2))) FROM reviews r JOIN products p ON p.product_id = r.product_id JOIN categories c ON c.category_id = p.category_id WHERE c.name = 'Electronics' AND r.rating REGEXP '^-?[0-9]+(\\.[0-9]+)?$'
  naive_sql: SELECT AVG(r.rating) FROM reviews r JOIN products p ON p.product_id = r.product_id JOIN categories c ON c.category_id = p.category_id WHERE c.name = 'Electronics'
- id: Q12
  defect_ids:
  - D5
  question: 最重的商品重量是多少千克？
  answer_type: scalar
  gold_sql: SELECT MAX(CAST(weight_kg AS DECIMAL(6,2))) FROM products WHERE weight_kg REGEXP '^-?[0-9]+(\\.[0-9]+)?$'
  naive_sql: SELECT MAX(weight_kg) FROM products
  notes: 文本比较：'9.9' 大于 '13.5'
