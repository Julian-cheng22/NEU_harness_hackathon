- id: MTQ07
  defect_ids:
  - MT04
  question: How many base cups physically entered inventory from posted purchases, counting each movement once?
  question_zh: 已过账采购入库实际增加多少杯库存（每个业务流水只计一次）？
  answer_type: scalar
  gold_sql: "WITH unique_in AS (\n  SELECT i.*, ROW_NUMBER() OVER (PARTITION BY movement_key ORDER BY row_id) AS\
    \ rn\n  FROM stock_in i\n) SELECT SUM(i.qty * CASE WHEN i.unit = 'box' THEN m.units_per_box ELSE 1 END) AS n\
    \ FROM unique_in i JOIN materials m USING(material_id) WHERE rn=1 AND status='posted' AND source_type='purchase'"
  notes: ''
  naive_sql: SELECT SUM(i.qty * CASE WHEN i.unit = 'box' THEN m.units_per_box ELSE 1 END) AS n FROM stock_in i JOIN
    materials m USING(material_id) WHERE status='posted' AND source_type='purchase'
  expect: 5620000.0
