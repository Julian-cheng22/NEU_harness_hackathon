- id: MTQ01
  defect_ids:
  - MT01
  question: What is the approved sales quantity in base cups?
  question_zh: 已审核销售数量合计多少杯（基本单位）？
  answer_type: scalar
  gold_sql: SELECT SUM(s.qty * CASE WHEN s.unit = 'box' THEN m.units_per_box ELSE 1 END) AS n FROM sales s JOIN
    materials m USING(material_id) WHERE s.status='approved'
  notes: ''
