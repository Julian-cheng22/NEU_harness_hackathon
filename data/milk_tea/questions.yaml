- id: MTQ20
  defect_ids:
  - MT01
  - MT02
  - MT04
  - MT06
  question: As of 2026-09-19, what is inventory on hand in base cups across all warehouses? Opening inventory before
    these documents was zero.
  question_zh: 截至2026-09-19，全部仓库共有多少杯库存？单据之前期初库存为零。
  answer_type: scalar
  gold_sql: "WITH unique_in AS (\n  SELECT i.*, ROW_NUMBER() OVER (PARTITION BY movement_key ORDER BY row_id) AS\
    \ rn\n  FROM stock_in i\n) SELECT (SELECT SUM(i.qty * CASE WHEN i.unit = 'box' THEN m.units_per_box ELSE 1 END)\
    \ FROM unique_in i JOIN materials m USING(material_id) WHERE rn=1 AND status='posted') - (SELECT SUM(o.qty *\
    \ CASE WHEN o.unit = 'box' THEN m.units_per_box ELSE 1 END) FROM stock_out o JOIN materials m USING(material_id)\
    \ WHERE status='posted') AS n"
  notes: Physical stock ledger only; sales orders are reservations and do not move inventory. Return and production
    stock-in mirrors must not be counted twice.
  naive_sql: SELECT (SELECT SUM(qty) FROM stock_in)+(SELECT SUM(qty) FROM production_receipts)-(SELECT SUM(qty)
    FROM stock_out) AS n
  expect: 6125768.0
