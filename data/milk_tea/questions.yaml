- id: MTQ11
  defect_ids:
  - MT06
  question: How many base cups physically entered inventory from completed production? Count each physical receipt
    once.
  question_zh: 生产完成入库实际增加多少杯库存？每次实际入库只计一次。
  answer_type: scalar
  gold_sql: SELECT SUM(p.qty * CASE WHEN p.unit = 'box' THEN m.units_per_box ELSE 1 END) AS n FROM production_receipts
    p JOIN materials m USING(material_id) WHERE status='completed'
  notes: ''
  naive_sql: SELECT SUM(n) AS n FROM (SELECT p.qty * CASE WHEN p.unit = 'box' THEN m.units_per_box ELSE 1 END AS
    n FROM production_receipts p JOIN materials m USING(material_id) WHERE status='completed' UNION ALL SELECT i.qty
    * CASE WHEN i.unit = 'box' THEN m.units_per_box ELSE 1 END AS n FROM stock_in i JOIN materials m USING(material_id)
    WHERE status='posted' AND source_type='production') x
  expect: 573200.0
- id: MTQ12
  defect_ids:
  - MT06
  question: What is the total physical inventory inflow in base cups from all posted sources, including production
    and returns? Count each movement once.
  question_zh: 所有已过账来源的实际入库合计多少杯（包括生产与退货，每个流水只计一次）？
  answer_type: scalar
  gold_sql: "WITH unique_in AS (\n  SELECT i.*, ROW_NUMBER() OVER (PARTITION BY movement_key ORDER BY row_id) AS\
    \ rn\n  FROM stock_in i\n) SELECT SUM(i.qty * CASE WHEN i.unit = 'box' THEN m.units_per_box ELSE 1 END) AS n\
    \ FROM unique_in i JOIN materials m USING(material_id) WHERE rn=1 AND status='posted'"
  notes: ''
  naive_sql: "WITH unique_in AS (\n  SELECT i.*, ROW_NUMBER() OVER (PARTITION BY movement_key ORDER BY row_id) AS\
    \ rn\n  FROM stock_in i\n) SELECT SUM(n) AS n FROM (SELECT i.qty * CASE WHEN i.unit = 'box' THEN m.units_per_box\
    \ ELSE 1 END AS n FROM unique_in i JOIN materials m USING(material_id) WHERE rn=1 AND status='posted' UNION\
    \ ALL SELECT p.qty * CASE WHEN p.unit = 'box' THEN m.units_per_box ELSE 1 END AS n FROM production_receipts\
    \ p JOIN materials m USING(material_id) WHERE status='completed') x"
  expect: 6196076.0
- id: MTQ13
  defect_ids:
  - MT07
  question: What is the highest valid measured stock-out weight in kg across all export rows?
  question_zh: 全部出库导出记录中，最高的有效实测重量是多少 kg？
  answer_type: scalar
  gold_sql: SELECT MAX(CAST(weight_text AS DECIMAL(18,4))) AS n FROM stock_out WHERE weight_text REGEXP '^[0-9]+([.][0-9]+)?$'
  notes: ''
  naive_sql: SELECT MAX(weight_text) AS n FROM stock_out
  expect: 499.75
- id: MTQ14
  defect_ids:
  - MT07
  question: What is the average valid measured stock-out weight in kg across all export rows, excluding unavailable
    readings? Round to 4 decimal places.
  question_zh: 全部出库记录的有效实测重量平均多少 kg（排除不可用读数，保留四位小数）？
  answer_type: scalar
  gold_sql: SELECT ROUND(AVG(CAST(weight_text AS DECIMAL(18,4))),4) AS n FROM stock_out WHERE weight_text REGEXP
    '^[0-9]+([.][0-9]+)?$'
  notes: ''
  naive_sql: SELECT ROUND(AVG(weight_text),4) AS n FROM stock_out
  expect: 250.606
