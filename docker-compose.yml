# Portable database for the whole team.
#
# Pinned to 8.0.35 to exactly match the native MySQL install on the Windows
# host, so nobody hits a version-skew bug that only reproduces on one machine.
#
# PORT NOTE: the Windows host already runs native MySQL on 3306. On that machine
# set MYSQL_HOST_PORT=3307 in .env so the two can coexist. On MacBooks the
# default 3306 is free, so no .env change is needed.
#
#   docker compose up -d
#   docker compose exec -T mysql mysql -uroot -phackathon harness < data/seed.sql

services:
  mysql:
    image: mysql:8.0.35
    container_name: harness_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-hackathon}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-harness}"
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    command:
      # The agent runs untrusted generated SQL. Cap how much damage a runaway
      # query can do to the demo machine.
      - --max-execution-time=15000
      - --local-infile=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      # Without this, `docker compose up -d` returns before MySQL accepts
      # connections and the seed load fails on a cold start.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-hackathon}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
