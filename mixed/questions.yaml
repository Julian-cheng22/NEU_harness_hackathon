# 30 questions: Q01-Q25 defect-focused (5 per industry), C01-C05 controls (1 per industry). Gold answers verified against MySQL for dataset v1.0.0.
questions:
- id: Q01
  defect_ids:
  - D1
  question: 【医疗】2023 年 12 月有多少位不同的患者被开过处方？
  answer_type: scalar
  gold_sql: SELECT COUNT(DISTINCT pat_id) FROM med_prescriptions WHERE start_time >= '2023-12-01' AND start_time < '2024-01-01'
  naive_sql: SELECT COUNT(DISTINCT subject_id) FROM med_prescriptions WHERE start_time >= '2023-12-01' AND start_time < '2024-01-01'
  notes: 领域：医疗；来源：medical 数据集 Q01
- id: Q02
  defect_ids:
  - D4
  question: 【医疗】目前仍在住院的患者有多少？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM med_admissions WHERE dischtime IS NULL AND discharge_location <> 'DIED'
  naive_sql: SELECT COUNT(*) FROM med_admissions WHERE dischtime IS NULL
  notes: 领域：医疗；来源：medical 数据集 Q04
- id: Q03
  defect_ids:
  - D5
  question: 【医疗】血肌酐（Creatinine）的平均值是多少？
  answer_type: scalar
  gold_sql: SELECT AVG(CAST(value AS DECIMAL(10,3))) FROM med_lab_events e JOIN med_lab_items i USING (itemid) WHERE i.label = 'Creatinine' AND value REGEXP '^-?[0-9]+(\\.[0-9]+)?$'
  naive_sql: SELECT AVG(value) FROM med_lab_events e JOIN med_lab_items i USING (itemid) WHERE i.label = 'Creatinine'
  notes: 领域：医疗；来源：medical 数据集 Q05
- id: Q04
  defect_ids:
  - D7
  question: 【医疗】2023-12-12（本地日期）当天完成了多少项化验？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM med_lab_events WHERE DATE(DATE_SUB(charttime, INTERVAL IF(source='LIS_BATCH',5,0) HOUR)) = '2023-12-12'
  naive_sql: SELECT COUNT(*) FROM med_lab_events WHERE DATE(charttime) = '2023-12-12'
  notes: 领域：医疗；来源：medical 数据集 Q07
- id: Q05
  defect_ids:
  - D10
  question: 【医疗】血糖（Glucose）平均值是多少（统一为 mg/dL）？
  answer_type: scalar
  gold_sql: SELECT AVG(CASE WHEN e.uom='mmol/L' THEN e.valuenum*18.016 ELSE e.valuenum END) FROM med_lab_events e JOIN med_lab_items i USING (itemid) WHERE i.label='Glucose'
  naive_sql: SELECT AVG(valuenum) FROM med_lab_events e JOIN med_lab_items i USING (itemid) WHERE i.label='Glucose'
  notes: 领域：医疗；来源：medical 数据集 Q10
- id: Q06
  defect_ids:
  - D2
  question: 【法律】已结案（CLOSED）的案件有多少件？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM leg_cases WHERE status = 'CLOSED'
  naive_sql: SELECT COUNT(*) FROM leg_cases WHERE status = 'paid'
  notes: 领域：法律；来源：legal 数据集 Q04。模型把 fee_invoices 的取值套到 cases 上
- id: Q07
  defect_ids:
  - D3
  question: 【法律】docket 文件数最多的前 5 个案件是哪些？（只统计确实存在的案件；同数按案件号升序）
  answer_type: table
  gold_sql: SELECT c.case_id FROM leg_cases c JOIN leg_docket_entries d ON d.case_no = c.case_id GROUP BY c.case_id ORDER BY COUNT(*) DESC, c.case_id LIMIT 5
  naive_sql: SELECT case_id FROM leg_cases ORDER BY num_filings DESC, case_id LIMIT 5
  notes: 领域：法律；来源：legal 数据集 Q06。cases.num_filings 是过期缓存
- id: Q08
  defect_ids:
  - D6
  question: 【法律】系统里一共有多少家不同的公司当事人？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM (SELECT name, state FROM leg_parties WHERE party_type = 'corporation' GROUP BY name, state) t
  naive_sql: SELECT COUNT(*) FROM leg_parties WHERE party_type = 'corporation'
  notes: 领域：法律；来源：legal 数据集 Q13
- id: Q09
  defect_ids:
  - D8
  question: 【法律】有多少条 docket 记录找不到对应的案件？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM leg_docket_entries d LEFT JOIN leg_cases c ON c.case_id = d.case_no WHERE c.case_id IS NULL
  naive_sql: SELECT COUNT(*) FROM leg_docket_entries d JOIN leg_cases c ON c.case_id = d.case_no WHERE c.case_id IS NULL
  notes: 领域：法律；来源：legal 数据集 Q19
- id: Q10
  defect_ids:
  - D9
  question: 【法律】按结案代码（disposition_code）统计各代码的案件数（不含未结案）。
  answer_type: table
  gold_sql: SELECT disposition_code, COUNT(*) FROM leg_cases WHERE disposition_code IS NOT NULL GROUP BY disposition_code
  naive_sql: SELECT disposition_code, COUNT(*) FROM leg_cases WHERE disposition_code BETWEEN 1 AND 4 GROUP BY disposition_code
  notes: 领域：法律；来源：legal 数据集 Q20。只信文档 1-4，漏掉 5-9
