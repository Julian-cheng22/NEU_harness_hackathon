- id: Q09
  defect_ids:
  - D9
  question: 出院去向（discharge_disposition）为 7 的住院有多少次？分别代表什么？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM admissions WHERE discharge_disposition = 7
  notes: 代码 5-9 为遗留系统，glossary 需说明"含义未知/遗留"，不能编造
- id: Q10
  defect_ids:
  - D10
  question: 血糖（Glucose）平均值是多少（统一为 mg/dL）？
  answer_type: scalar
  gold_sql: SELECT AVG(CASE WHEN e.uom='mmol/L' THEN e.valuenum*18.016 ELSE e.valuenum END) FROM lab_events e JOIN lab_items i USING (itemid) WHERE i.label='Glucose'
  naive_sql: SELECT AVG(valuenum) FROM lab_events e JOIN lab_items i USING (itemid) WHERE i.label='Glucose'
- id: Q11
  defect_ids:
  - D1
  question: 有多少位患者既有理赔记录又有处方记录？
  answer_type: scalar
  gold_sql: SELECT COUNT(DISTINCT c.patient_id) FROM claims c JOIN prescriptions r ON r.pat_id = c.patient_id
  naive_sql: SELECT COUNT(DISTINCT c.patient_id) FROM claims c JOIN prescriptions r ON r.subject_id = c.patient_id
  notes: prescriptions 的患者列叫 pat_id，不是 subject_id
- id: Q12
  defect_ids:
  - D1
  question: 已支付（paid）理赔笔数最多的前 3 位患者是谁？（同数按患者 ID 升序）
  answer_type: table
  gold_sql: SELECT patient_id FROM claims WHERE status = 'paid' GROUP BY patient_id ORDER BY COUNT(*) DESC, patient_id LIMIT 3
  naive_sql: SELECT subject_id FROM claims WHERE status = 'paid' GROUP BY subject_id ORDER BY COUNT(*) DESC, subject_id LIMIT 3
- id: Q13
  defect_ids:
  - D2
  question: 已出院（DISCHARGED）的住院有多少次？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM admissions WHERE status = 'DISCHARGED'
  naive_sql: SELECT COUNT(*) FROM admissions WHERE status = 'paid'
  notes: 模型从 claims 学到 paid，套到 admissions 上返回 0
- id: Q14
  defect_ids:
  - D3
  question: 最近一次住院在 Cardiology 科室的患者有多少位？
  answer_type: scalar
  gold_sql: SELECT COUNT(DISTINCT a.subject_id) FROM admissions a JOIN departments d ON d.dept_id = a.dept_id WHERE d.name = 'Cardiology' AND a.admittime = (SELECT MAX(b.admittime) FROM admissions b WHERE b.subject_id = a.subject_id)
  naive_sql: SELECT COUNT(*) FROM patients p JOIN departments d ON d.dept_id = p.last_dept_id WHERE d.name = 'Cardiology'
  notes: patients.last_dept_id 是过期缓存
- id: Q15
  defect_ids:
