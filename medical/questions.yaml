# 31 questions: Q01-Q25 defect-focused, C01-C06 controls. Gold answers verified against MySQL for dataset v1.0.0.
questions:
- id: Q01
  defect_ids:
  - D1
  question: 2023 年 12 月有多少位不同的患者被开过处方？
  answer_type: scalar
  gold_sql: SELECT COUNT(DISTINCT pat_id) FROM prescriptions WHERE start_time >= '2023-12-01' AND start_time < '2024-01-01'
  naive_sql: SELECT COUNT(DISTINCT subject_id) FROM prescriptions WHERE start_time >= '2023-12-01' AND start_time < '2024-01-01'
- id: Q02
  defect_ids:
  - D2
  question: 状态为已支付的理赔总共有多少笔？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM claims WHERE status = 'paid'
  naive_sql: SELECT COUNT(*) FROM claims WHERE status = 'DISCHARGED'
- id: Q03
  defect_ids:
  - D3
  question: 住院次数最多的前 5 位患者是谁？
  answer_type: table
  gold_sql: SELECT subject_id FROM admissions GROUP BY subject_id ORDER BY COUNT(*) DESC, subject_id LIMIT 5
  naive_sql: SELECT subject_id FROM patients ORDER BY total_admissions DESC, subject_id LIMIT 5
- id: Q04
  defect_ids:
  - D4
  question: 目前仍在住院的患者有多少？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM admissions WHERE dischtime IS NULL AND discharge_location <> 'DIED'
  naive_sql: SELECT COUNT(*) FROM admissions WHERE dischtime IS NULL
- id: Q05
  defect_ids:
  - D5
  question: 血肌酐（Creatinine）的平均值是多少？
  answer_type: scalar
  gold_sql: SELECT AVG(CAST(value AS DECIMAL(10,3))) FROM lab_events e JOIN lab_items i USING (itemid) WHERE i.label = 'Creatinine' AND value REGEXP '^-?[0-9]+(\\.[0-9]+)?$'
  naive_sql: SELECT AVG(value) FROM lab_events e JOIN lab_items i USING (itemid) WHERE i.label = 'Creatinine'
- id: Q06
  defect_ids:
  - D6
  question: 医院一共有多少位不同的患者？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM (SELECT 1 FROM patients GROUP BY name, dob) t
  naive_sql: SELECT COUNT(DISTINCT subject_id) FROM patients
- id: Q07
  defect_ids:
  - D7
  question: 2023-12-12（本地日期）当天完成了多少项化验？
  answer_type: scalar
  gold_sql: SELECT COUNT(*) FROM lab_events WHERE DATE(DATE_SUB(charttime, INTERVAL IF(source='LIS_BATCH',5,0) HOUR)) = '2023-12-12'
